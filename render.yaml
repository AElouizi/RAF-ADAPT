services:
  - type: web
    name: raf-adapt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run experiments/factorial_hybrid_adapt/web/app_c4.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      # Ajouter dans le dashboard Render (Environment) :
      # SUPABASE_URL, SUPABASE_KEY (ou SUPABASE_ANON_KEY)
